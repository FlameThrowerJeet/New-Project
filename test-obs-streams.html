<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Streams Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: #00d4aa;
            font-family: 'Courier New', monospace;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .stream-box {
            background: #1a1a1a;
            border: 2px solid #00d4aa;
            border-radius: 8px;
            padding: 15px;
            min-height: 400px;
        }
        .stream-title {
            color: #00d4aa;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        .stream-status {
            color: #888;
            font-size: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        video, img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border: 1px solid #333;
            border-radius: 4px;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background: #00d4aa;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        button:hover {
            background: #00fff7;
        }
        .status-connected {
            color: #00ff00;
        }
        .status-error {
            color: #ff4444;
        }
        .servers-info {
            grid-column: 1 / -1;
            background: #2a2a2a;
            border: 2px solid #666;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 30px;">🎥 OBS STREAMS TEST</h1>
    
    <div class="servers-info">
        <h2>📡 Server Status</h2>
        <div id="serverStatus">Checking servers...</div>
    </div>

    <div class="container">
        <!-- Browser API Stream -->
        <div class="stream-box">
            <div class="stream-title">🌐 BROWSER API STREAM</div>
            <div class="stream-status" id="browserStatus">Initializing...</div>
            <video id="browserVideo" autoplay muted></video>
            <div class="controls">
                <button onclick="testBrowserAPI()">Test Browser API</button>
                <button onclick="stopBrowserStream()">Stop</button>
            </div>
        </div>

        <!-- HTTP MP4 Stream -->
        <div class="stream-box">
            <div class="stream-title">🎬 HTTP MP4 STREAM (8003)</div>
            <div class="stream-status" id="mp4Status">Ready to test...</div>
            <video id="mp4Video" autoplay muted></video>
            <div class="controls">
                <button onclick="testMP4Stream()">Test MP4 Stream</button>
                <button onclick="stopMP4Stream()">Stop</button>
            </div>
        </div>

        <!-- HTTP MJPEG Stream -->
        <div class="stream-box">
            <div class="stream-title">📷 HTTP MJPEG STREAM (8080)</div>
            <div class="stream-status" id="mjpegStatus">Ready to test...</div>
            <img id="mjpegImage" alt="MJPEG Stream" style="display: none;">
            <div class="controls">
                <button onclick="testMJPEGStream()">Test MJPEG Stream</button>
                <button onclick="stopMJPEGStream()">Stop</button>
            </div>
        </div>

        <!-- Background Test -->
        <div class="stream-box">
            <div class="stream-title">🔙 BACKGROUND STREAM TEST</div>
            <div class="stream-status" id="backgroundStatus">Background overlay test</div>
            <div style="position: relative; height: 300px; background: #333; border-radius: 4px; overflow: hidden;">
                <video id="backgroundVideo" autoplay muted style="position: absolute; width: 100%; height: 100%; opacity: 0.3;"></video>
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px;">
                    CONTENT ON TOP
                </div>
            </div>
            <div class="controls">
                <button onclick="testBackground()">Test Background</button>
                <button onclick="stopBackground()">Stop</button>
            </div>
        </div>
    </div>

    <script>
        let browserStream = null;

        // Test server availability
        async function checkServers() {
            const serverStatus = document.getElementById('serverStatus');
            let status = '';
            
            try {
                const mp4Response = await fetch('http://localhost:8003/', { method: 'HEAD' });
                status += '✅ MP4 Server (8003): Online<br>';
            } catch (e) {
                status += '❌ MP4 Server (8003): Offline<br>';
            }
            
            try {
                const mjpegResponse = await fetch('http://localhost:8080/', { method: 'HEAD' });
                status += '✅ MJPEG Server (8080): Online<br>';
            } catch (e) {
                status += '❌ MJPEG Server (8080): Offline<br>';
            }
            
            try {
                const mainResponse = await fetch('http://localhost:3001/', { method: 'HEAD' });
                status += '✅ Main Server (3001): Online';
            } catch (e) {
                status += '❌ Main Server (3001): Offline';
            }
            
            serverStatus.innerHTML = status;
        }

        // Browser API Test
        async function testBrowserAPI() {
            const video = document.getElementById('browserVideo');
            const status = document.getElementById('browserStatus');
            
            try {
                status.innerHTML = '🔄 Searching for OBS Virtual Camera...';
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const obsCamera = devices.find(d => 
                    d.kind === 'videoinput' && 
                    (d.label.toLowerCase().includes('obs') || d.label.toLowerCase().includes('virtual'))
                );
                
                if (!obsCamera) {
                    status.innerHTML = '❌ OBS Virtual Camera not found';
                    return;
                }
                
                status.innerHTML = `🔄 Connecting to: ${obsCamera.label}`;
                
                browserStream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId: obsCamera.deviceId },
                    audio: false
                });
                
                video.srcObject = browserStream;
                status.innerHTML = `<span class="status-connected">✅ Connected: ${obsCamera.label}</span>`;
                
            } catch (error) {
                status.innerHTML = `<span class="status-error">❌ Error: ${error.message}</span>`;
            }
        }

        function stopBrowserStream() {
            if (browserStream) {
                browserStream.getTracks().forEach(track => track.stop());
                browserStream = null;
            }
            document.getElementById('browserVideo').srcObject = null;
            document.getElementById('browserStatus').innerHTML = 'Stopped';
        }

        // MP4 Stream Test
        function testMP4Stream() {
            const video = document.getElementById('mp4Video');
            const status = document.getElementById('mp4Status');
            
            status.innerHTML = '🔄 Connecting to MP4 stream...';
            
            video.onloadstart = () => status.innerHTML = '🔄 Loading MP4 stream...';
            video.oncanplay = () => status.innerHTML = '<span class="status-connected">✅ MP4 Stream Connected</span>';
            video.onerror = () => status.innerHTML = '<span class="status-error">❌ MP4 Stream Failed</span>';
            
            video.src = 'http://localhost:8003/stream';
        }

        function stopMP4Stream() {
            const video = document.getElementById('mp4Video');
            video.src = '';
            document.getElementById('mp4Status').innerHTML = 'Stopped';
        }

        // MJPEG Stream Test
        function testMJPEGStream() {
            const img = document.getElementById('mjpegImage');
            const status = document.getElementById('mjpegStatus');
            
            status.innerHTML = '🔄 Connecting to MJPEG stream...';
            
            img.onload = () => {
                status.innerHTML = '<span class="status-connected">✅ MJPEG Stream Connected</span>';
                img.style.display = 'block';
            };
            img.onerror = () => status.innerHTML = '<span class="status-error">❌ MJPEG Stream Failed</span>';
            
            img.src = 'http://localhost:8080/video_feed';
        }

        function stopMJPEGStream() {
            const img = document.getElementById('mjpegImage');
            img.src = '';
            img.style.display = 'none';
            document.getElementById('mjpegStatus').innerHTML = 'Stopped';
        }

        // Background Test
        async function testBackground() {
            const video = document.getElementById('backgroundVideo');
            const status = document.getElementById('backgroundStatus');
            
            try {
                status.innerHTML = '🔄 Testing background stream...';
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const obsCamera = devices.find(d => 
                    d.kind === 'videoinput' && 
                    (d.label.toLowerCase().includes('obs') || d.label.toLowerCase().includes('virtual'))
                );
                
                if (obsCamera) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { deviceId: obsCamera.deviceId },
                        audio: false
                    });
                    
                    video.srcObject = stream;
                    status.innerHTML = '<span class="status-connected">✅ Background Stream Active</span>';
                } else {
                    status.innerHTML = '❌ OBS Camera not found for background';
                }
                
            } catch (error) {
                status.innerHTML = `<span class="status-error">❌ Background Error: ${error.message}</span>`;
            }
        }

        function stopBackground() {
            const video = document.getElementById('backgroundVideo');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            document.getElementById('backgroundStatus').innerHTML = 'Background stopped';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkServers();
        });
    </script>
</body>
</html>
